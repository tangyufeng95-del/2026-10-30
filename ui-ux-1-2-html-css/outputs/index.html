<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>日序・個人行程與任務</title>
  <style>
    :root{--ink:#202720;--muted:#818981;--line:#e9ebe5;--paper:#f7f7f4;--white:#fff;--green:#316e52;--green2:#e9f1e9;--peach:#f7e7de;--shadow:0 18px 60px #27372b12}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif} button,input,select{font:inherit} button{cursor:pointer;color:inherit} .app{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--paper);position:relative;padding-bottom:96px;overflow:hidden;box-shadow:0 0 60px #2233220b}
    .top{padding:22px 23px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:.06em}.mark{width:27px;height:27px;border-radius:9px;background:var(--green);color:white;display:grid;place-items:center;font-size:15px}.top-actions{display:flex;gap:9px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:13px;display:grid;place-items:center;font-size:16px;position:relative}.badge{position:absolute;right:-2px;top:-2px;background:#d97c5d;color:white;border:2px solid var(--paper);font-size:9px;border-radius:9px;padding:0 4px}
    .greeting{padding:16px 24px 18px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#858e84;font-weight:700}.greeting h1{font-size:29px;line-height:1.2;margin:5px 0 7px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px}.progress-card{margin:0 22px 24px;background:var(--green);color:#fff;border-radius:21px;padding:17px 18px 15px;position:relative;overflow:hidden}.progress-card:after{content:"";position:absolute;width:125px;height:125px;border:1px solid #ffffff22;border-radius:50%;right:-26px;top:-59px;box-shadow:0 0 0 17px #ffffff09,0 0 0 34px #ffffff07}.progress-line{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#e0ede1}.progress-line strong{font-size:14px;color:#fff}.bar{height:5px;border-radius:9px;background:#ffffff35;margin-top:14px;overflow:hidden}.bar span{height:100%;display:block;background:#d4dfab;border-radius:9px;transition:width .3s}.progress-foot{font-size:10px;color:#d7e5d8;margin-top:8px}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:0 23px 12px}.section-title{font-weight:750;font-size:16px;letter-spacing:-.02em}.section-note{font-size:11px;color:var(--muted)}.date-strip{display:flex;gap:9px;padding:0 22px 21px;overflow-x:auto;scrollbar-width:none}.date-strip::-webkit-scrollbar{display:none}.day{flex:0 0 49px;border:0;background:transparent;border-radius:17px;padding:8px 3px 9px;color:#879087;display:flex;flex-direction:column;align-items:center;gap:4px}.day .dow{font-size:10px}.day .num{font-size:16px;font-weight:650;color:#39423a}.day.active{background:var(--green);color:#dce9dd;box-shadow:0 6px 14px #316e522e}.day.active .num{color:#fff}.day.today:not(.active) .num:after{content:"";width:4px;height:4px;display:block;background:#d48766;border-radius:50%;margin:3px auto -7px}
    .timeline{padding:0 22px 20px}.event-row{display:grid;grid-template-columns:49px 1fr;min-height:90px}.event-time{font-size:11px;color:#80897f;padding-top:14px;font-variant-numeric:tabular-nums}.event-track{border-left:1px solid #e3e7df;position:relative;padding:0 0 13px 15px}.event-track:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#b9c8bc;left:-4px;top:16px;border:2px solid var(--paper)}.event-card{border-radius:15px;padding:11px 13px;background:#e8efe8;border-left:3px solid #659277;cursor:pointer;min-height:69px;transition:transform .16s}.event-card:hover{transform:translateY(-1px)}.event-card.rose{background:#f6e8e1;border-color:#d48d70}.event-card.blue{background:#e8edf4;border-color:#8298b2}.event-card.gold{background:#f2eedf;border-color:#b6a65c}.event-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.event-title{font-size:13px;font-weight:700}.event-tag{font-size:9px;color:#68746a;background:#ffffff8c;padding:3px 7px;border-radius:9px;white-space:nowrap}.event-meta{font-size:10px;color:#69746a;margin-top:4px}.empty{border:1px dashed #d9ded7;border-radius:15px;text-align:center;padding:22px 12px;color:#8a938a;font-size:12px;margin:4px 0 12px}
    .tasks-wrap{margin:0 22px 19px}.task-panel{background:var(--white);border:1px solid #edeee9;border-radius:19px;padding:4px 14px;box-shadow:0 5px 20px #293d2907}.task-row{display:flex;align-items:center;gap:11px;min-height:59px;border-bottom:1px solid #f0f1ed}.task-row:last-child{border-bottom:0}.check{width:20px;height:20px;flex:none;border:1.5px solid #c5ccc3;border-radius:7px;background:#fff;display:grid;place-items:center;font-size:12px;color:white;padding:0}.check.done{background:var(--green);border-color:var(--green)}.task-main{flex:1;min-width:0}.task-name{font-size:12px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{font-size:10px;color:#949c93;display:block;margin-top:2px}.task-row.completed .task-name{text-decoration:line-through;color:#9ba29a}.task-row.completed .task-meta{opacity:.7}.task-add{border:0;background:none;color:var(--green);font-size:11px;font-weight:700;padding:10px 0 5px;display:flex;align-items:center;gap:6px}.task-add span{font-size:17px}
    .bottom-nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:10px 24px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid #e9ebe5;display:flex;justify-content:space-around}.nav-item{border:0;background:none;color:#9aa199;font-size:9px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:51px}.nav-item .nav-icon{font-size:18px;line-height:1}.nav-item.active{color:var(--green);font-weight:700}.fab{position:fixed;z-index:6;bottom:76px;left:calc(50% + 145px);width:51px;height:51px;border-radius:18px;border:0;background:var(--green);color:#fff;font-size:25px;box-shadow:0 8px 22px #316e5245;display:grid;place-items:center}.fab:hover{transform:translateY(-2px)}
    .toast{position:fixed;z-index:20;left:50%;bottom:145px;transform:translate(-50%,12px);background:#26372c;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 30px)}.toast.show{opacity:1;transform:translate(-50%,0)}
    .overlay{position:fixed;z-index:30;inset:0;background:#19241d5c;display:none;align-items:flex-end;justify-content:center;padding:16px}.overlay.show{display:flex}.sheet{background:#fbfcf9;width:min(430px,100%);border-radius:26px 26px 20px 20px;padding:10px 21px 22px;box-shadow:0 18px 70px #14201640;animation:up .2s ease;max-height:92dvh;overflow:auto}.handle{width:38px;height:4px;border-radius:4px;background:#d8ddd6;margin:1px auto 15px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.sheet-head h2{font-size:19px;margin:0}.close{border:0;background:#edf0eb;width:32px;height:32px;border-radius:11px;font-size:18px;color:#586257}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:700;color:#687368;margin:0 0 6px}.field input,.field select{width:100%;border:1px solid #e2e7df;background:#fff;border-radius:12px;padding:12px 12px;font-size:13px;color:#29332b;outline:none}.field input:focus,.field select:focus{border-color:#71a082;box-shadow:0 0 0 3px #316e5212}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.colors{display:flex;gap:9px}.color-option{width:30px;height:30px;border:3px solid #fff;outline:1px solid #dfe3dc;border-radius:50%;padding:0}.color-option.sel{outline:2px solid var(--green)}.submit{width:100%;border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:700;padding:13px;margin-top:4px}.delete-btn{width:100%;border:0;background:none;color:#b76550;font-size:12px;padding:10px 0 0}.reminder-copy{background:#eef3ec;border-radius:13px;padding:12px 13px;color:#647065;font-size:11px;margin:4px 0 15px}.task-notice{margin:0 22px 18px;border-radius:15px;background:#f3ece0;border:1px solid #eee5d4;padding:11px 13px;font-size:11px;color:#737056;display:flex;gap:9px;align-items:flex-start}.task-notice strong{color:#645d3b}
    .list-page{padding-bottom:25px}.filter-row{display:flex;gap:8px;margin:0 22px 14px}.filter{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:10px;color:#7b847a}.filter.active{background:var(--green);color:#fff;border-color:var(--green)}.all-task-list{margin:0 22px}.task-group-label{font-size:10px;color:#899188;font-weight:700;letter-spacing:.08em;margin:14px 3px 7px}.all-task-list .task-panel{padding:4px 14px}.empty-state{text-align:center;padding:48px 25px;color:#899188}.empty-icon{font-size:27px;margin-bottom:8px}
    @keyframes up{from{transform:translateY(18px);opacity:.7}to{transform:translateY(0);opacity:1}}
    @media(min-width:500px){body{padding:20px 0}.app{border-radius:29px;min-height:calc(100dvh - 40px)}.bottom-nav{bottom:20px;border-radius:0 0 29px 29px}.fab{bottom:96px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span class="mark">◷</span> 日序 <span style="font-weight:450;color:#899188;font-size:11px;letter-spacing:0">DAYFLOW</span></div><div class="top-actions"><button class="icon-btn" id="notifyBtn" aria-label="通知設定">♧</button><button class="icon-btn" id="bellBtn" aria-label="查看提醒">♧<span class="badge" id="bellBadge">2</span></button></div></header>
  <main id="main"></main>
  <nav class="bottom-nav"><button class="nav-item active" data-tab="today"><span class="nav-icon">◷</span>今天</button><button class="nav-item" data-tab="tasks"><span class="nav-icon">☷</span>所有任務</button><button class="nav-item" data-tab="calendar"><span class="nav-icon">▦</span>行程</button><button class="nav-item" data-tab="settings"><span class="nav-icon">⚙</span>設定</button></nav>
  <button class="fab" id="fab" aria-label="新增">＋</button>
</div>
<div class="overlay" id="overlay"><section class="sheet" id="sheet"></section></div><div class="toast" id="toast"></div>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, today=iso(new Date());
  const shift=(date,days)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return iso(d)};
  const seed=()=>({events:[
    {id:'e1',title:'晨間伸展與咖啡',date:today,start:'08:00',end:'08:45',category:'生活',color:'green',note:'給自己一點安靜時間'},
    {id:'e2',title:'產品設計週會',date:today,start:'10:00',end:'11:00',category:'工作',color:'blue',note:'確認本週設計進度'},
    {id:'e3',title:'午餐・小巷食堂',date:today,start:'12:15',end:'13:15',category:'生活',color:'rose',note:''},
    {id:'e4',title:'整理下週旅行計畫',date:today,start:'15:30',end:'16:15',category:'個人',color:'gold',note:'查交通與住宿選項'}
  ],tasks:[
    {id:'t1',title:'回覆設計合作夥伴',date:today,time:'',done:false},
    {id:'t2',title:'補充洗衣精與日用品',date:today,time:'18:00',done:false},
    {id:'t3',title:'規劃京都旅行預算',date:shift(today,4),time:'',done:false},
    {id:'t4',title:'每月整理雲端相簿',date:shift(today,9),time:'',done:false},
    {id:'t5',title:'提交報帳資料',date:today,time:'',done:true}
  ]});
  let db;try{db=JSON.parse(localStorage.getItem('dayflow-data'))||seed()}catch{db=seed()}
  let selected=today, tab='today',taskFilter='all',editing=null,formType='event',chosenColor='green';
  const save=()=>localStorage.setItem('dayflow-data',JSON.stringify(db));
  const fmt=d=>{const x=new Date(d+'T12:00:00');return `${x.getMonth()+1}月${x.getDate()}日`};
  const dayName=d=>new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(new Date(d+'T12:00:00')).replace('週','');
  const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)};
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const colorName={green:'青綠',rose:'珊瑚',blue:'霧藍',gold:'暖黃'};
  function render(){ $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));$('#fab').style.display=tab==='settings'?'none':'grid';
    if(tab==='today')renderToday();else if(tab==='tasks')renderTasks();else if(tab==='calendar')renderCalendar();else renderSettings(); }
  function renderToday(){
    const date=new Date(selected+'T12:00:00'); const isToday=selected===today;
    const dates=Array.from({length:7},(_,i)=>shift(today,i-2));
    const events=db.events.filter(e=>e.date===selected).sort((a,b)=>a.start.localeCompare(b.start));
    const tasks=db.tasks.filter(t=>t.date===selected).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const done=tasks.filter(t=>t.done).length;
    $('#main').innerHTML=`<div class="greeting"><div class="eyebrow">${isToday?'YOUR DAY, AT A GLANCE':'DAYFLOW · 每日總覽'}</div><h1>${isToday?'早安，今天也慢慢來。':`${date.getMonth()+1} 月 ${date.getDate()} 日`}</h1><div class="sub">${isToday?'留一點空間，給重要的事。':`${dayName(selected)} · 安排得剛剛好`}</div></div>
    <div class="progress-card"><div class="progress-line"><span>今日小進度</span><strong>${done} <span style="opacity:.65;font-weight:450">/ ${tasks.length} 項完成</span></strong></div><div class="bar"><span style="width:${tasks.length?done/tasks.length*100:0}%"></span></div><div class="progress-foot">${tasks.length?(done===tasks.length?'做得很好，今天的任務都完成了。':'一步一步來，你正在前進。'):'今天還沒有待辦，享受留白也很好。'}</div></div>
    <div class="section-head"><div class="section-title">${isToday?'今天，':'當日，'}${date.getMonth()+1}/${pad(date.getDate())}</div><div class="section-note">${events.length} 個行程</div></div><div class="date-strip">${dates.map(d=>`<button class="day ${d===selected?'active':''} ${d===today?'today':''}" data-date="${d}"><span class="dow">${dayName(d)}</span><span class="num">${new Date(d+'T12:00:00').getDate()}</span></button>`).join('')}</div>
    <div class="section-head"><div class="section-title">行程時間軸</div><button class="section-note" style="border:0;background:none" data-add="event">＋ 新增</button></div><div class="timeline">${events.length?events.map(e=>`<div class="event-row"><div class="event-time">${e.start}</div><div class="event-track"><div class="event-card ${e.color==='green'?'':e.color}" data-event="${e.id}"><div class="event-top"><span class="event-title">${esc(e.title)}</span><span class="event-tag">${esc(e.category||'其他')}</span></div><div class="event-meta">${e.start} – ${e.end}${e.note?' · '+esc(e.note):''}</div></div></div></div>`).join(''):'<div class="empty">這天還沒有安排。<br>點右下角的 ＋，把想做的事放進來。</div>'}</div>
    <div class="section-head"><div class="section-title">今日待辦</div><div class="section-note">${tasks.filter(t=>!t.done).length} 件待完成</div></div><div class="tasks-wrap"><div class="task-panel">${tasks.length?tasks.map(taskRow).join(''):'<div class="empty" style="border:0;margin:0">今天沒有待辦，留白也很好。</div>'}<button class="task-add" data-add="task"><span>＋</span> 新增待辦</button></div></div>
    ${db.tasks.some(t=>t.date!==today&&!t.done)?`<div class="task-notice"><span>◷</span><div><strong>晚間 9 點任務回顧</strong><br>將彙整非今日到期的未完成任務，在此顯示提醒預覽。</div></div>`:''}`;
    bindCommon();
  }
  function taskRow(t){return `<div class="task-row ${t.done?'completed':''}"><button class="check ${t.done?'done':''}" data-check="${t.id}" aria-label="完成任務">${t.done?'✓':''}</button><div class="task-main" data-task="${t.id}"><span class="task-name">${esc(t.title)}</span><span class="task-meta">${t.date===today?'今天':fmt(t.date)}${t.time?' · '+t.time:''}${t.date!==today?' · 長期任務':''}</span></div><button class="icon-btn" style="width:29px;height:29px;border:0;background:transparent;color:#9ba39a" data-edit-task="${t.id}" aria-label="編輯">···</button></div>`}
  function renderTasks(){const list=db.tasks.filter(t=>taskFilter==='all'||(taskFilter==='open'?!t.done:t.done)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));$('#main').innerHTML=`<div class="greeting"><div class="eyebrow">YOUR TASKS</div><h1>待辦清單</h1><div class="sub">把事情記下來，心裡就能輕一點。</div></div><div class="filter-row">${[['all','全部'],['open','未完成'],['done','已完成']].map(([id,label])=>`<button class="filter ${taskFilter===id?'active':''}" data-filter="${id}">${label}</button>`).join('')}</div><div class="all-task-list">${list.length?groupTasks(list):'<div class="empty-state"><div class="empty-icon">☼</div><div>這裡還沒有任務，<br>新增一件開始整理吧。</div></div>'}</div>`;bindCommon();$$('[data-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.filter;render()})}
  function groupTasks(list){let html='',last='';for(const t of list){const group=t.done?'已完成':t.date===today?'今天':t.date<today?'已逾期':fmt(t.date);if(group!==last){html+=`<div class="task-group-label">${group.toUpperCase()}</div><div class="task-panel">`;if(last)html+='</div>';last=group}html+=taskRow(t)}return html+'</div>'}
  function renderCalendar(){const dates=Array.from({length:14},(_,i)=>shift(today,i-3));$('#main').innerHTML=`<div class="greeting"><div class="eyebrow">YOUR SCHEDULE</div><h1>行程安排</h1><div class="sub">選擇日期，看看這天的節奏。</div></div><div class="date-strip">${dates.map(d=>`<button class="day ${selected===d?'active':''} ${d===today?'today':''}" data-date="${d}"><span class="dow">${dayName(d)}</span><span class="num">${new Date(d+'T12:00:00').getDate()}</span></button>`).join('')}</div><div class="section-head"><div class="section-title">${fmt(selected)} 的行程</div><button class="section-note" style="border:0;background:none" data-add="event">＋ 新增</button></div><div class="timeline">${db.events.filter(e=>e.date===selected).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>`<div class="event-row"><div class="event-time">${e.start}</div><div class="event-track"><div class="event-card ${e.color==='green'?'':e.color}" data-event="${e.id}"><div class="event-top"><span class="event-title">${esc(e.title)}</span><span class="event-tag">${esc(e.category||'其他')}</span></div><div class="event-meta">${e.start} – ${e.end}${e.note?' · '+esc(e.note):''}</div></div></div></div>`).join('')||'<div class="empty">這天還沒有安排，為自己留一些空白也不錯。</div>'}</div>`;bindCommon()}
  function renderSettings(){const permission=Notification?.permission||'unsupported';$('#main').innerHTML=`<div class="greeting"><div class="eyebrow">PREFERENCES</div><h1>設定與提醒</h1><div class="sub">依照你的步調，調整日序的提醒方式。</div></div><div class="tasks-wrap"><div class="task-panel" style="padding:16px"><div style="font-weight:700;font-size:13px">提醒偏好</div><div style="font-size:10px;color:#858e84;margin-top:4px">可在支援的瀏覽器中開啟系統通知。</div><div class="task-row" style="margin-top:9px"><span style="font-size:17px">◷</span><div class="task-main"><span class="task-name">行程前 30 分鐘</span><span class="task-meta">有時間的行程將提前提醒</span></div><span style="color:#5d8b67">●</span></div><div class="task-row"><span style="font-size:17px">☾</span><div class="task-main"><span class="task-name">晚間 9 點任務回顧</span><span class="task-meta">彙整非今日到期的未完成任務</span></div><span style="color:#5d8b67">●</span></div><button class="submit" id="permissionBtn">${permission==='granted'?'系統通知已開啟':permission==='denied'?'通知權限已封鎖':'開啟系統通知'}</button><div class="reminder-copy" style="margin-top:11px">提示：背景通知需要瀏覽器保持開啟。此原型將提醒預覽顯示在頁面內，並可依權限發送瀏覽器通知。</div></div></div><div class="tasks-wrap"><div class="task-panel" style="padding:16px"><div style="font-weight:700;font-size:13px">資料管理</div><div style="font-size:10px;color:#858e84;margin:4px 0 10px">資料儲存在目前瀏覽器的本機裝置。</div><button class="filter" id="resetBtn">清除範例資料並重新開始</button></div></div>`;bindCommon();$('#permissionBtn').onclick=async()=>{if(!('Notification'in window)){toast('此瀏覽器不支援系統通知');return}const p=await Notification.requestPermission();toast(p==='granted'?'已開啟瀏覽器通知':'通知尚未開啟');render()};$('#resetBtn').onclick=()=>{if(confirm('確定要清除目前資料並載入範例？')){db=seed();save();toast('已重新載入範例資料');render()}}}
  function bindCommon(){$$('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});$$('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));$$('[data-event]').forEach(e=>e.onclick=()=>openForm('event',e.dataset.event));$$('[data-check]').forEach(b=>b.onclick=()=>{const t=db.tasks.find(t=>t.id===b.dataset.check);t.done=!t.done;save();render()});$$('[data-edit-task]').forEach(b=>b.onclick=()=>openForm('task',b.dataset.editTask));$$('[data-task]').forEach(e=>e.onclick=()=>openForm('task',e.dataset.task))}
  function openForm(type,id){formType=type;editing=id||null;const item=id?(type==='event'?db.events:db.tasks).find(x=>x.id===id):null;chosenColor=item?.color||'green';const title=type==='event'?'行程':'待辦任務';let body='';if(type==='event'){body=`<div class="field"><label>行程名稱</label><input id="fTitle" placeholder="例如：和朋友喝咖啡" value="${esc(item?.title||'')}"></div><div class="field"><label>日期</label><input id="fDate" type="date" value="${item?.date||selected}"></div><div class="form-grid"><div class="field"><label>開始時間</label><input id="fStart" type="time" value="${item?.start||'09:00'}"></div><div class="field"><label>結束時間</label><input id="fEnd" type="time" value="${item?.end||'10:00'}"></div></div><div class="field"><label>分類名稱</label><input id="fCategory" placeholder="工作、生活、個人…" value="${esc(item?.category||'個人')}"></div><div class="field"><label>分類顏色</label><div class="colors">${[['green','#72947a'],['rose','#d89579'],['blue','#8da2ba'],['gold','#c0ad62']].map(([v,c])=>`<button class="color-option ${chosenColor===v?'sel':''}" data-color="${v}" style="background:${c}" aria-label="${colorName[v]}"></button>`).join('')}</div></div><div class="field"><label>備註（選填）</label><input id="fNote" placeholder="補充資訊" value="${esc(item?.note||'')}"></div>`}
    else body=`<div class="field"><label>任務名稱</label><input id="fTitle" placeholder="例如：回覆訊息" value="${esc(item?.title||'')}"></div><div class="field"><label>到期日期（選填）</label><input id="fDate" type="date" value="${item?.date||selected}"></div><div class="field"><label>到期時間（選填）</label><input id="fTime" type="time" value="${item?.time||''}"></div><div class="reminder-copy">非今天到期的未完成任務會歸入長期清單，並在晚上 9 點的提醒預覽中彙整。</div>`;
    $('#sheet').innerHTML=`<div class="handle"></div><div class="sheet-head"><h2>${editing?'編輯':'新增'}${title}</h2><button class="close" id="closeSheet">×</button></div>${body}<button class="submit" id="saveForm">${editing?'儲存變更':'加入我的日序'}</button>${editing?'<button class="delete-btn" id="deleteItem">刪除此項目</button>':''}`;$('#overlay').classList.add('show');$('#closeSheet').onclick=closeForm;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeForm()};$$('[data-color]').forEach(b=>b.onclick=()=>{chosenColor=b.dataset.color;$$('[data-color]').forEach(x=>x.classList.toggle('sel',x===b))});$('#saveForm').onclick=()=>saveForm(type,id);if(editing)$('#deleteItem').onclick=()=>{if(confirm('確定刪除這個項目？')){if(type==='event')db.events=db.events.filter(x=>x.id!==id);else db.tasks=db.tasks.filter(x=>x.id!==id);save();closeForm();render();toast('已刪除')}};setTimeout(()=>$('#fTitle')?.focus(),180)}
  function saveForm(type,id){const title=$('#fTitle').value.trim();if(!title){toast('請先輸入名稱');$('#fTitle').focus();return}if(type==='event'){const date=$('#fDate').value,start=$('#fStart').value,end=$('#fEnd').value;if(!date||!start||!end){toast('請完整設定日期與起訖時間');return}if(end<=start){toast('結束時間需晚於開始時間');return}const obj={id:id||'e'+Date.now(),title,date,start,end,category:$('#fCategory').value.trim()||'其他',color:chosenColor,note:$('#fNote').value.trim()};if(id)Object.assign(db.events.find(x=>x.id===id),obj);else db.events.push(obj)}else{const date=$('#fDate').value||today,obj={id:id||'t'+Date.now(),title,date,time:$('#fTime').value,done:id?db.tasks.find(x=>x.id===id).done:false};if(id)Object.assign(db.tasks.find(x=>x.id===id),obj);else db.tasks.push(obj)}save();closeForm();render();toast(id?'已更新':'已加入日序')}
  function closeForm(){$('#overlay').classList.remove('show')}
  function bindReminder(){const reminderItems=()=>db.tasks.filter(t=>!t.done&&t.date!==today);$('#bellBtn').onclick=()=>{const list=reminderItems();if(!list.length){toast('目前沒有需要晚間彙整的任務');return}const message=`晚間 9 點任務回顧 · ${list.length} 件\n`+list.map(t=>`• ${t.title}（${fmt(t.date)}${t.time?' '+t.time:''}）`).join('\n');if('Notification'in window&&Notification.permission==='granted'){new Notification('日序｜晚間任務回顧',{body:list.map(t=>t.title).join('、')})}alert(message)};$('#notifyBtn').onclick=()=>{tab='settings';render()};
    setInterval(()=>{const now=new Date(),key=iso(now),hh=pad(now.getHours()),mm=pad(now.getMinutes());if(hh==='21'&&mm==='00'&&localStorage.getItem('dayflow-evening-'+key)!=='1'){const tasks=reminderItems();if(tasks.length){const msg=`晚間 9 點任務回顧：${tasks.length} 件未完成任務。`;toast(msg);if('Notification'in window&&Notification.permission==='granted')new Notification('日序｜晚間任務回顧',{body:tasks.map(t=>t.title).join('、')});localStorage.setItem('dayflow-evening-'+key,'1')}}db.events.filter(e=>e.date===key).forEach(e=>{const target=new Date(`${e.date}T${e.start}:00`);target.setMinutes(target.getMinutes()-30);const k='dayflow-event-'+e.id;if(Math.abs(now-target)<35000&&localStorage.getItem(k)!=='1'){toast(`行程提醒：${e.title} 將於 30 分鐘後開始`);if('Notification'in window&&Notification.permission==='granted')new Notification('日序｜30 分鐘後',{body:e.title});localStorage.setItem(k,'1')}})},30000)}
  $$('.nav-item').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#fab').onclick=()=>openForm(tab==='calendar'?'event':'task');$('#overlay').addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});render();bindReminder();
})();
</script>
</body>
